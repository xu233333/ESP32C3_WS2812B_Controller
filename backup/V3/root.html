<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WS2812B 矩阵控制器</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 20px;
        }
        .grid {
            position: relative;
            margin: 20px auto;
            background: #f0f0f0;
            border: 1px solid #ccc;
            min-height: 500px;
            min-width: 500px;
        }
        .grid_cell {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: 2px solid #ccc;
            cursor: pointer;
            transition: transform 0.1s;
            box-sizing: border-box;
        }
        .grid_cell:hover {
            transform: scale(1.05);
            border-color: #888;
        }
        .grid_cell input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .cell {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            border: 2px solid #ccc;
            cursor: pointer;
            position: relative;
        }
        .cell:hover {
            transform: scale(1.05);
            border-color: #888;
        }
        .cell input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
        .status {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }
        .batch-control {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
<h1>WS2812B 矩阵控制器</h1>
<div id="grid" class="grid" style="width: 837px; height: 837px;"></div>
<div class="brightness-control">
    <label>亮度:
        <input type="range" id="brightnessSlider" min="0" max="255" value="16">
        <input type="number" id="brightnessNumber" min="0" max="255" step="1" value="16">
    </label>
</div>
<div class="batch-control">
    <div id="batchColorCell" class="cell" style="background-color: #000000; display: inline-block; margin: 0; cursor: pointer;">
        <input type="color" id="batchColor" value="#000000">
    </div>
    <button id="batchApplyBtn">全部应用此颜色</button>
    <button id="randomBtn">随机颜色</button>
</div>
<button id="updateBtn">更新颜色</button>
<button id="setBtn">应用颜色</button>
<div class="reboot-control">
    <button id="rebootNormalBtn">重启设备（正常模式）</button>
    <button id="rebootAPBtn">重启进入配网模式</button>
</div>

<script>
    let totalLeds = 4;
    let colors = [];
    let currentBrightness = 16;
    let gridInitialized = false;
    let led_position = []

    function rgbToHex(rgb) {
        return '#' + ((1 << 24) + (rgb[0] << 16) + (rgb[1] << 8) + rgb[2]).toString(16).slice(1);
    }

    function hexToRgb(hex) {
        let r = parseInt(hex.slice(1,3), 16);
        let g = parseInt(hex.slice(3,5), 16);
        let b = parseInt(hex.slice(5,7), 16);
        return [r, g, b];
    }

    function createGrid() {
        const gridDiv = document.getElementById('grid');

        // 确保 colors 数组长度匹配
        if (colors.length !== totalLeds) {
            colors = new Array(totalLeds).fill('#000000');
        }

        for (let i = 0; i < totalLeds; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid_cell';
            cell.style.position = 'absolute';
            cell.style.left = led_position[i][0] * 3 + 12 + 'px';
            cell.style.top = led_position[i][1] * 3 + 12 + 'px';
            cell.style.backgroundColor = colors[i];

            const input = document.createElement('input');
            input.type = 'color';
            input.value = colors[i];
            input.addEventListener('change', (function(idx, inp) {
                return function(e) {
                    const newColor = e.target.value;
                    colors[idx] = newColor;
                    cell.style.backgroundColor = newColor;
                };
            })(i, input));

            cell.appendChild(input);
            gridDiv.appendChild(cell);
        }
    }

    function updateGridColors() {
        const cells = document.querySelectorAll('.grid_cell');
        for (let i = 0; i < totalLeds && i < cells.length; i++) {
            cells[i].style.backgroundColor = colors[i];
            const input = cells[i].querySelector('input');
            if (input) input.value = colors[i];
        }
    }

    async function fetchColors() {
        try {
            const response = await fetch('/api/get');
            if (!response.ok) throw new Error('获取失败');
            const data = await response.json();

            // 首次获取时，根据返回的 ROW/COL 初始化网格
            if (!gridInitialized && data.WS2812B_ROW && data.WS2812B_COL) {
                rows = data.WS2812B_ROW;
                cols = data.WS2812B_COL;
                totalLeds = rows * cols;
                gridInitialized = true;
                createGrid();
            }

            // 更新颜色数组
            if (data.WS2812B && Array.isArray(data.WS2812B)) {
                const rgbArray = data.WS2812B;
                // 确保颜色数组长度正确
                if (rgbArray.length === totalLeds) {
                    for (let i = 0; i < totalLeds; i++) {
                        const rgb = rgbArray[i];
                        if (rgb && rgb.length === 3) {
                            colors[i] = rgbToHex(rgb);
                        }
                    }
                    // 刷新界面
                    updateGridColors();
                } else {
                    console.warn(`颜色数组长度 ${rgbArray.length} 与预期 ${totalLeds} 不符`);
                }
            }

            // 更新亮度
            if (typeof data.WS2812B_Brightness === 'number') {
                currentBrightness = data.WS2812B_Brightness;
                document.getElementById('brightnessSlider').value = currentBrightness;
                document.getElementById('brightnessNumber').value = currentBrightness;
            }
        } catch (err) {
            console.error('获取颜色失败:', err);
        }
    }

    async function sendColors() {
        const rgbArray = [];
        for (let i = 0; i < totalLeds; i++) {
            rgbArray.push(hexToRgb(colors[i]));
        }
        currentBrightness = parseInt(document.getElementById('brightnessSlider').value, 10);
        const payload = {
            WS2812B: rgbArray,
            WS2812B_Brightness: currentBrightness
        };
        try {
            const response = await fetch('/api/set', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error('设置失败');
            const text = await response.text();
            console.log(text);
        } catch (err) {
            console.error('设置颜色失败:', err);
        }
    }

    function setAllColors(color) {
        for (let i = 0; i < totalLeds; i++) {
            colors[i] = color;
        }
        updateGridColors();
    }

    async function fillRandom() {
        try {
            const response = await fetch('/api/random', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            if (!response.ok) throw new Error('随机填充失败');
            await fetchColors();
        } catch (err) {
            console.error('随机填充失败:', err);
        }
    }

    async function reboot(apMode) {
        try {
            const response = await fetch('/api/reboot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ AP_MODE: apMode })
            });
            if (!response.ok) throw new Error('连接失败');
            alert('设备正在重启...');
        } catch (err) {
            console.error('重启请求失败:', err);
            alert('重启失败: ' + err.message);
        }
    }

    function initBatchColorPicker() {
        const colorPickerCell = document.getElementById('batchColorCell');
        const hiddenInput = document.getElementById('batchColor');

        colorPickerCell.addEventListener('click', () => {
            hiddenInput.click();
        });

        hiddenInput.addEventListener('change', (e) => {
            const newColor = e.target.value;
            colorPickerCell.style.backgroundColor = newColor;
        });
    }

    // 亮度滑块与数字框联动
    const slider = document.getElementById('brightnessSlider');
    const numberInput = document.getElementById('brightnessNumber');

    slider.addEventListener('input', function() {
        numberInput.value = this.value;
        currentBrightness = parseInt(this.value, 10);
        // 可选：实时更新亮度（如果希望即时生效），这里不自动发送，等待用户点击按钮
    });
    numberInput.addEventListener('input', function() {
        let val = parseInt(this.value, 10);
        if (isNaN(val)) val = 0;
        val = Math.min(255, Math.max(0, val));
        slider.value = val;
        this.value = val;
        currentBrightness = val;
    });

    // 绑定按钮事件
    document.getElementById('batchApplyBtn').onclick = () => {
        const batchColor = document.getElementById('batchColor').value;
        setAllColors(batchColor);
    };
    document.getElementById('randomBtn').onclick = fillRandom;

    document.getElementById('updateBtn').onclick = fetchColors;
    document.getElementById('setBtn').onclick = sendColors;

    document.getElementById('rebootNormalBtn').onclick = () => reboot(0);
    document.getElementById('rebootAPBtn').onclick = () => reboot(1);

    // 初始化
    createGrid();
    initBatchColorPicker();
    fetchColors();
    // 再次刷新颜色
    setTimeout(() => {
        fetchColors();
    }, 500);
</script>
</body>
</html>
