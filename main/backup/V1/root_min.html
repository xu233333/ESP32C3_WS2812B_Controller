<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport"content="width=device-width, initial-scale=1"><title>WS2812B 5x5控制器</title><style>body{font-family:sans-serif;text-align:center;margin:20px}.grid{display:grid;grid-template-columns:repeat(5,60px);gap:10px;justify-content:center;margin:20px auto}.cell{width:60px;height:60px;border-radius:8px;border:2px solid#ccc;cursor:pointer;position:relative}.cell:hover{transform:scale(1.05);border-color:#888}.cell input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}button{padding:10px 20px;font-size:16px;margin:10px;cursor:pointer}.status{margin-top:20px;color:green;font-weight:bold}.batch-control{display:flex;justify-content:center;gap:20px;margin:20px auto}</style></head><body><h1>WS2812B 5x5灯珠控制</h1><div id="grid"class="grid"></div><div class="batch-control"><div id="batchColorCell"class="cell"style="background-color: #000000; display: inline-block; margin: 0; cursor: pointer;"><input type="color"id="batchColor"value="#000000"></div><button id="batchApplyBtn">全部应用此颜色</button><button id="randomBtn">随机颜色</button></div><div class="brightness-control"><label>亮度:<input type="range"id="brightnessSlider"min="0"max="255"value="16"><input type="number"id="brightnessNumber"min="0"max="255"step="1"value="16"></label><button id="setBrightnessBtn">设置亮度</button></div><button id="updateBtn">更新颜色</button><button id="setBtn">应用颜色</button><div id="status"class="status"></div><script>const NUM_LEDS=25;let colors=new Array(NUM_LEDS).fill('#000000');function createGrid(){const gridDiv=document.getElementById('grid');gridDiv.innerHTML='';for(let i=0;i<NUM_LEDS;i++){const cell=document.createElement('div');cell.className='cell';cell.style.backgroundColor=colors[i];const input=document.createElement('input');input.type='color';input.value=colors[i];input.addEventListener('change',(function(idx,inp){return function(e){const newColor=e.target.value;colors[idx]=newColor;cell.style.backgroundColor=newColor}})(i,input));cell.appendChild(input);gridDiv.appendChild(cell)}}async function fetchColors(){try{const response=await fetch('/api/get');if(!response.ok)throw new Error('获取失败');colors=await response.json();const cells=document.querySelectorAll('.cell');for(let i=0;i<NUM_LEDS;i++){cells[i].style.backgroundColor=colors[i];const input=cells[i].querySelector('input');if(input)input.value=colors[i]}document.getElementById('status').innerText='已从服务器更新颜色';setTimeout(()=>document.getElementById('status').innerText='',2000)}catch(err){document.getElementById('status').innerText='更新失败: '+err.message}}async function sendColors(){try{const response=await fetch('/api/set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(colors)});const text=await response.text();if(!response.ok)throw new Error(text);document.getElementById('status').innerText=text;setTimeout(()=>document.getElementById('status').innerText='',2000)}catch(err){document.getElementById('status').innerText='设置失败: '+err.message}}function setAllColors(color){const cells=document.querySelectorAll('.cell');for(let i=0;i<NUM_LEDS;i++){colors[i]=color;cells[i].style.backgroundColor=color;const input=cells[i].querySelector('input');if(input)input.value=color}document.getElementById('status').innerText='已批量设置为 '+color;setTimeout(()=>document.getElementById('status').innerText='',2000)}async function fillRandom(){try{const response=await fetch('/api/fill_random',{method:'POST',headers:{'Content-Type':'application/json'}});const text=await response.text();if(!response.ok)throw new Error(text);document.getElementById('status').innerText=text;await fetchColors()}catch(err){document.getElementById('status').innerText='随机填充失败: '+err.message}}async function setBrightness(){const brightness=parseInt(document.getElementById('brightnessSlider').value,10);try{const response=await fetch('/api/set_brightness',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brightness:brightness})});const text=await response.text();if(!response.ok)throw new Error(text);document.getElementById('status').innerText=text}catch(err){document.getElementById('status').innerText='设置亮度失败: '+err.message}}function initBatchColorPicker(){const colorPickerCell=document.getElementById('batchColorCell');const hiddenInput=document.getElementById('batchColor');colorPickerCell.addEventListener('click',()=>{hiddenInput.click()});hiddenInput.addEventListener('change',(e)=>{const newColor=e.target.value;colorPickerCell.style.backgroundColor=newColor})}const slider=document.getElementById('brightnessSlider');const numberInput=document.getElementById('brightnessNumber');slider.addEventListener('input',function(){numberInput.value=this.value});numberInput.addEventListener('input',function(){let val=parseInt(this.value,10);if(isNaN(val))val=0;val=Math.min(255,Math.max(0,val));slider.value=val;this.value=val});document.getElementById('updateBtn').onclick=fetchColors;document.getElementById('setBtn').onclick=sendColors;document.getElementById('batchApplyBtn').onclick=()=>{const batchColor=document.getElementById('batchColor').value;setAllColors(batchColor)};document.getElementById('randomBtn').onclick=fillRandom;document.getElementById('setBrightnessBtn').onclick=setBrightness;createGrid();initBatchColorPicker();setTimeout(()=>{fetchColors()},500);</script></body></html>
